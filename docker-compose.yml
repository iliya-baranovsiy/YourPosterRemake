version: "3.9"

services:
  api:
    build: .
    container_name: tg_bot_api
    env_file:
      - .env.prod
    environment:
      TZ: Europe/Moscow
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: tg_pgbouncer
    restart: always
    ports:
      - "6432:5432"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "localhost", "-p", "6432" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: tg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tg_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "redis-cli", "-h", "127.0.0.1", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: tg_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  celery_parsing:
    build: .
    container_name: celery_parsing
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: Europe/Moscow
    command: celery -A celery_scheduler.celery_app worker -Q parsing -n parsing@%h --concurrency=2 --pool=prefork --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  celery_background:
    build: .
    container_name: celery_background
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: Europe/Moscow
    command: celery -A celery_scheduler.celery_app worker -Q background_tasks -n background@%h --concurrency=4 --pool=prefork --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  celery_posting:
    build: .
    container_name: celery_posting
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: Europe/Moscow
    command: celery -A celery_scheduler.celery_app worker -Q posting_tasks -n posting@%h --concurrency=2 --pool=prefork --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: celery_beat
    restart: always
    env_file:
      - .env.prod
    environment:
      TZ: Europe/Moscow
    command: celery -A celery_scheduler.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data: